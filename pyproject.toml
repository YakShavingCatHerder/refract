[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "refract-venv"
version = "0.1.0"
description = "Lightweight centralized virtual environment manager for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "YakShavingCatHerder" }
]

keywords = [
    "virtualenv",
    "venv",
    "cli",
    "python",
    "developer-tools"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
]

[project.urls]
Homepage = "https://github.com/YakShavingCatHerder/refract"
Repository = "https://github.com/YakShavingCatHerder/refract"
Issues = "https://github.com/YakShavingCatHerder/refract/issues"

[project.scripts]
refract = "refract:main"

[tool.setuptools]
py-modules = ["refract"]
