name: CI

on:
  pull_request:
    branches: [staging, main]

jobs:
  build:
    name: Build and twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  wheel:
    name: Wheel ${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.shell }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shell: [bash, zsh]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install zsh
        if: matrix.os == 'ubuntu-latest' && matrix.shell == 'zsh'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install wheel
        run: python -m pip install dist/refract_venv-0.1.0-py3-none-any.whl

      - name: Smoke test CLI
        env:
          REFRACT_TEST_SHELL: ${{ matrix.shell == 'zsh' && '/bin/zsh' || '/bin/bash' }}
        run: python -m unittest discover -s tests -v -p 'test_cli.py'

  sdist:
    name: Sdist ${{ matrix.os }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install sdist
        run: python -m pip install dist/refract_venv-0.1.0.tar.gz

      - name: Smoke test CLI
        env:
          REFRACT_TEST_SHELL: /bin/bash
        run: python -m unittest discover -s tests -v -p 'test_cli.py'

  install-script:
    name: install.sh ${{ matrix.method }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        method: [python, pip, pipx]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx
        if: matrix.method == 'pipx'
        run: python -m pip install --upgrade pipx

      - name: Run install.sh tests
        env:
          REFRACT_TEST_INSTALL_SH: "1"
          REFRACT_TEST_INSTALL_METHOD: ${{ matrix.method }}
          SHELL: /bin/bash
        run: |
          if [ "${{ matrix.method }}" = "python" ]; then
            python -m unittest tests.test_install_sh.InstallScriptTests.test_python_only -v
          elif [ "${{ matrix.method }}" = "pip" ]; then
            python -m unittest tests.test_install_sh.InstallScriptTests.test_pip -v
          else
            python -m unittest tests.test_install_sh.InstallScriptTests.test_pipx -v
          fi
