name: CI

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and twine check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  wheel:
    name: Wheel ${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.shell }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shell: [bash, zsh]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install zsh
        if: matrix.os == 'ubuntu-latest' && matrix.shell == 'zsh'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Smoke test CLI
        env:
          REFRACT_TEST_SHELL: ${{ matrix.shell == 'zsh' && '/bin/zsh' || '/bin/bash' }}
        run: python -m unittest discover -s tests -v -p 'test_cli.py'

  sdist:
    name: Sdist ${{ matrix.os }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install sdist
        run: python -m pip install dist/*.tar.gz

      - name: Smoke test CLI
        env:
          REFRACT_TEST_SHELL: /bin/bash
        run: python -m unittest discover -s tests -v -p 'test_cli.py'

  install-script:
    name: install.sh ${{ matrix.method }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        method: [python, pipx]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx
        if: matrix.method == 'pipx'
        run: python -m pip install --upgrade pipx

      - name: Run install.sh tests
        env:
          REFRACT_TEST_INSTALL_SH: "1"
          REFRACT_TEST_INSTALL_METHOD: ${{ matrix.method }}
          SHELL: /bin/bash
        run: |
          if [ "${{ matrix.method }}" = "python" ]; then
            python -m unittest tests.test_install_sh.InstallScriptTests.test_python_only -v
          else
            python -m unittest tests.test_install_sh.InstallScriptTests.test_pipx -v
          fi

  ci:
    name: CI
    if: always()
    needs: [build, wheel, sdist, install-script]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        run: |
          echo "build=${{ needs.build.result }}"
          echo "wheel=${{ needs.wheel.result }}"
          echo "sdist=${{ needs.sdist.result }}"
          echo "install-script=${{ needs.install-script.result }}"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.wheel.result }}" = "success"
          test "${{ needs.sdist.result }}" = "success"
          test "${{ needs.install-script.result }}" = "success"
